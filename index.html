<!DOCTYPE html>
<html lang="ru" class="dark h-full">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover" />
  <title>Androma Tasker</title>
  
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
  <meta name="apple-mobile-web-app-title" content="Androma" />
  <meta name="theme-color" content="#000000" />

  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet" />

  <script src="https://cdn.tailwindcss.com"></script>
  <script>
    tailwind.config = {
      darkMode: 'class',
      theme: {
        extend: {
          fontFamily: { sans: ['Inter', '-apple-system', 'BlinkMacSystemFont', 'sans-serif'] },
          colors: {
            ios: {
              blue: '#007AFF',
              green: '#34C759',
              red: '#FF3B30',
              textSecondary: '#8E8E93'
            }
          }
        }
      }
    }
  </script>

  <script src="https://unpkg.com/lucide@latest"></script>
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

  <style>
    :root {
      --bg-main: #F2F2F7;
      --bg-card: #FFFFFF;
      --bg-subcard: #E5E5EA;
      --text-main: #000000;
      --text-muted: #8E8E93;
      --border-color: rgba(0, 0, 0, 0.08);
      --blur-bg: rgba(255, 255, 255, 0.85);
    }

    .dark {
      --bg-main: #000000;
      --bg-card: #1C1C1E;
      --bg-subcard: #2C2C2E;
      --text-main: #FFFFFF;
      --text-muted: #8E8E93;
      --border-color: rgba(255, 255, 255, 0.1);
      --blur-bg: rgba(28, 28, 30, 0.85);
    }

    body {
      background-color: var(--bg-main);
      color: var(--text-main);
      font-family: 'Inter', -apple-system, BlinkMacSystemFont, sans-serif;
      -webkit-tap-highlight-color: transparent;
      transition: background-color 0.25s ease, color 0.25s ease;
    }

    .ios-card {
      background-color: var(--bg-card);
      border: 1px solid var(--border-color);
      transition: background-color 0.25s ease, border-color 0.25s ease;
    }

    .ios-subcard {
      background-color: var(--bg-subcard);
      border: 1px solid var(--border-color);
      transition: background-color 0.25s ease;
    }

    .ios-blur {
      background-color: var(--blur-bg);
      backdrop-filter: blur(20px);
      -webkit-backdrop-filter: blur(20px);
      border-color: var(--border-color);
    }

    .safe-area-bottom {
      padding-bottom: max(1.25rem, env(safe-area-inset-bottom));
    }

    select.custom-select {
      appearance: none;
      -webkit-appearance: none;
      -moz-appearance: none;
      background-image: none;
      text-align-last: center;
    }

    @keyframes iosEnter {
      from { opacity: 0; transform: translateY(8px) scale(0.97); }
      to { opacity: 1; transform: translateY(0) scale(1); }
    }

    @keyframes iosExit {
      from { opacity: 1; transform: translateY(0) scale(1); max-height: 180px; margin-bottom: 0.75rem; }
      to { opacity: 0; transform: translateY(-8px) scale(0.95); max-height: 0px; margin-bottom: 0px; padding-top: 0; padding-bottom: 0; border: 0; }
    }

    @keyframes iconSwap {
      0% { transform: rotate(0deg) scale(1); opacity: 1; }
      50% { transform: rotate(90deg) scale(0.2); opacity: 0; }
      100% { transform: rotate(0deg) scale(1); opacity: 1; }
    }

    @keyframes badgePop {
      0% { transform: scale(1); }
      50% { transform: scale(1.3); }
      100% { transform: scale(1); }
    }

    .animate-enter {
      animation: iosEnter 0.22s cubic-bezier(0.16, 1, 0.3, 1) forwards;
    }

    .animate-exit {
      animation: iosExit 0.22s cubic-bezier(0.16, 1, 0.3, 1) forwards;
      overflow: hidden;
      pointer-events: none;
    }

    .animate-icon-swap {
      animation: iconSwap 0.3s cubic-bezier(0.16, 1, 0.3, 1) forwards;
    }

    .animate-pop {
      animation: badgePop 0.25s cubic-bezier(0.175, 0.885, 0.32, 1.275) forwards;
    }

    ::-webkit-scrollbar { width: 0px; }
  </style>
</head>

<body class="min-h-full flex flex-col justify-between select-none antialiased">

  <header class="sticky top-0 z-30 pt-4 pb-3 px-5 flex items-center justify-between ios-blur border-b">
    <div>
      <h1 class="text-base font-bold leading-tight">Androma Tasker</h1>
      <p class="text-[11px] text-ios-textSecondary font-normal">Голосовой органайзер</p>
    </div>

    <button id="btn-theme-toggle" class="w-9 h-9 rounded-full ios-subcard flex items-center justify-center active:scale-95 transition-transform">
      <i id="icon-theme" data-lucide="sun" class="w-4 h-4"></i>
    </button>
  </header>

  <main class="flex-1 max-w-lg w-full mx-auto px-4 py-5 flex flex-col space-y-5 mb-28">
    <div class="flex p-1 ios-card rounded-full">
      <button data-tab="today" class="tab-btn flex-1 py-2 text-xs font-semibold rounded-full transition-all duration-200 bg-ios-blue text-white">
        Сегодня (<span id="count-today" class="inline-block">0</span>)
      </button>
      <button data-tab="upcoming" class="tab-btn flex-1 py-2 text-xs font-medium text-ios-textSecondary hover:text-ios-blue rounded-full transition-all duration-200">
        Предстоящие (<span id="count-upcoming" class="inline-block">0</span>)
      </button>
      <button data-tab="completed" class="tab-btn flex-1 py-2 text-xs font-medium text-ios-textSecondary hover:text-ios-blue rounded-full transition-all duration-200">
        Готово (<span id="count-completed" class="inline-block">0</span>)
      </button>
    </div>

    <div id="ai-loader" class="hidden ios-card rounded-2xl p-5 text-center space-y-2 animate-enter">
      <div class="flex justify-center">
        <i data-lucide="loader-2" class="w-5 h-5 text-ios-blue animate-spin"></i>
      </div>
      <div>
        <h4 class="text-sm font-semibold">Анализ запроса...</h4>
        <p class="text-xs text-ios-textSecondary">Формируем структурированные задачи</p>
      </div>
    </div>

    <div id="task-list" class="space-y-3"></div>

    <div id="empty-state" class="hidden flex-col items-center justify-center py-16 text-center space-y-3 animate-enter">
      <div class="w-12 h-12 rounded-full ios-subcard flex items-center justify-center text-ios-textSecondary">
        <i data-lucide="check-circle-2" class="w-6 h-6"></i>
      </div>
      <div>
        <p class="text-sm font-semibold">Список пуст</p>
        <p class="text-xs text-ios-textSecondary mt-1 max-w-xs">Нажмите на микрофон или введите текст для добавления планов.</p>
      </div>
    </div>
  </main>

  <div id="modal-draft" class="fixed inset-0 z-50 bg-black/60 backdrop-blur-sm hidden flex items-end justify-center">
    <div class="w-full max-w-lg ios-card rounded-t-3xl max-h-[85vh] flex flex-col overflow-hidden animate-enter">
      <div class="p-5 border-b border-white/10 flex justify-between items-center">
        <div>
          <span class="text-[10px] uppercase font-bold text-ios-blue">Сгенерированный план</span>
          <h3 id="draft-summary" class="text-sm font-semibold truncate max-w-xs">Новые задачи</h3>
        </div>
        <button id="btn-close-draft" class="w-8 h-8 rounded-full ios-subcard flex items-center justify-center text-ios-textSecondary hover:text-ios-blue">
          <i data-lucide="x" class="w-4 h-4"></i>
        </button>
      </div>

      <div id="draft-tasks-container" class="p-5 overflow-y-auto space-y-3 flex-1"></div>

      <div class="p-4 border-t border-white/10 safe-area-bottom flex space-x-3">
        <button id="btn-discard-draft" class="flex-1 py-3 text-xs font-semibold ios-subcard rounded-full hover:opacity-80 transition">Отмена</button>
        <button id="btn-confirm-draft" class="flex-1 py-3 text-xs font-semibold text-white bg-ios-blue rounded-full hover:opacity-90 transition">Сохранить всё</button>
      </div>
    </div>
  </div>

  <div id="modal-date-picker" class="fixed inset-0 z-50 bg-black/60 backdrop-blur-sm hidden flex items-center justify-center p-4">
    <div class="w-full max-w-xs ios-card rounded-3xl p-5 space-y-4 animate-enter">
      <div class="flex justify-between items-center">
        <h3 class="text-sm font-bold">Настройка времени</h3>
        <button id="btn-close-datepicker" class="w-7 h-7 rounded-full ios-subcard flex items-center justify-center text-ios-textSecondary">
          <i data-lucide="x" class="w-4 h-4"></i>
        </button>
      </div>
      
      <div class="grid grid-cols-2 gap-2">
        <button onclick="applyDatePreset('today')" class="py-1.5 px-3 rounded-full ios-subcard text-[11px] font-medium hover:text-ios-blue transition">Сегодня</button>
        <button onclick="applyDatePreset('tomorrow')" class="py-1.5 px-3 rounded-full ios-subcard text-[11px] font-medium hover:text-ios-blue transition">Завтра</button>
        <button onclick="applyDatePreset('plus1h')" class="py-1.5 px-3 rounded-full ios-subcard text-[11px] font-medium hover:text-ios-blue transition">+1 Час</button>
        <button onclick="applyDatePreset('plus1d')" class="py-1.5 px-3 rounded-full ios-subcard text-[11px] font-medium hover:text-ios-blue transition">+1 День</button>
      </div>

      <div class="space-y-3 pt-2">
        <div>
          <label class="text-[10px] uppercase font-bold text-ios-textSecondary block mb-1">Дата</label>
          <div class="flex space-x-1">
            <select id="picker-day" class="custom-select flex-1 py-2 px-2 rounded-full ios-subcard text-xs font-semibold focus:outline-none focus:ring-1 focus:ring-ios-blue"></select>
            <select id="picker-month" class="custom-select flex-2 py-2 px-2 rounded-full ios-subcard text-xs font-semibold focus:outline-none focus:ring-1 focus:ring-ios-blue"></select>
            <select id="picker-year" class="custom-select flex-1 py-2 px-2 rounded-full ios-subcard text-xs font-semibold focus:outline-none focus:ring-1 focus:ring-ios-blue"></select>
          </div>
        </div>

        <div>
          <label class="text-[10px] uppercase font-bold text-ios-textSecondary block mb-1">Время</label>
          <div class="flex items-center space-x-2">
            <select id="picker-hour" class="custom-select flex-1 py-2 px-2 rounded-full ios-subcard text-xs font-semibold focus:outline-none focus:ring-1 focus:ring-ios-blue"></select>
            <span class="font-bold text-ios-textSecondary">:</span>
            <select id="picker-minute" class="custom-select flex-1 py-2 px-2 rounded-full ios-subcard text-xs font-semibold focus:outline-none focus:ring-1 focus:ring-ios-blue"></select>
          </div>
        </div>
      </div>

      <div class="pt-2">
        <button id="btn-save-datepicker" class="w-full py-2.5 text-xs font-semibold text-white bg-ios-blue rounded-full transition active:scale-95">Сохранить</button>
      </div>
    </div>
  </div>

  <div class="fixed bottom-0 inset-x-0 z-40 ios-blur safe-area-bottom pt-3 pb-3 px-4 border-t">
    <div class="max-w-lg mx-auto flex items-end space-x-2">
      <div class="flex-1 ios-subcard rounded-full px-4 py-2.5 flex items-center min-h-[44px]">
        <textarea id="text-input" rows="1" placeholder="Запишите мысли..." class="w-full bg-transparent text-sm placeholder-ios-textSecondary focus:outline-none resize-none max-h-24 leading-snug"></textarea>
      </div>

      <div class="relative flex items-center space-x-2">
        <div id="recording-status" class="hidden absolute -top-11 right-0 bg-ios-red text-white px-3 py-1 rounded-full text-[11px] font-mono font-semibold flex items-center space-x-1.5 shadow-md animate-enter">
          <span id="recording-timer">00:00</span>
        </div>

        <button id="btn-mic" class="w-11 h-11 rounded-full bg-ios-blue active:scale-95 text-white flex items-center justify-center transition-all duration-200 touch-none">
          <i id="icon-mic" data-lucide="mic" class="w-5 h-5"></i>
        </button>

        <button id="btn-send" class="hidden w-11 h-11 rounded-full bg-ios-green text-white items-center justify-center transition-all duration-200 active:scale-95">
          <i data-lucide="arrow-up" class="w-5 h-5"></i>
        </button>
      </div>
    </div>
  </div>

  <script>
    // CONFIGURATION
    const CONFIG = {
      WORKER_URL: "https://tasker-proxy-secret.sqwerxride.workers.dev",
      MODEL: "meta-llama/llama-3.3-70b-instruct:free",
      SYNC_URL: "https://kgbkbnzwxwcvnxbugoja.supabase.co",
      SYNC_KEY: "eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6ImtnYmtibnp3eHdjdm54YnVnb2phIiwicm9sZSI6ImFub24iLCJpYXQiOjE3ODYyMjM3MjUsImV4cCI6MjEwMTc5OTcyNX0.XUeuSRaa82P4-fuEV2yDgXHcraeWUpLgQfel32pptQw"
    };

    const MONTHS = ['Янв', 'Фев', 'Мар', 'Апр', 'Май', 'Июн', 'Июл', 'Авг', 'Сен', 'Окт', 'Ноя', 'Дек'];

    const state = {
      theme: localStorage.getItem('androma_theme') || 'dark',
      tasks: JSON.parse(localStorage.getItem('androma_tasks') || '[]'),
      activeTab: 'today',
      draftTasks: [],
      editingContext: null,
      recording: {
        isRecording: false,
        isLocked: false,
        speechRecognition: null,
        transcriptText: "",
        startTime: null,
        timerInterval: null,
        startY: 0
      }
    };

    let syncClient = null;
    if (CONFIG.SYNC_URL && CONFIG.SYNC_KEY && CONFIG.SYNC_URL !== "YOUR_SYNC_URL_HERE" && window.supabase) {
      syncClient = window.supabase.createClient(CONFIG.SYNC_URL, CONFIG.SYNC_KEY);
    }

    const DOM = {
      btnThemeToggle: document.getElementById('btn-theme-toggle'),
      iconTheme: document.getElementById('icon-theme'),
      taskList: document.getElementById('task-list'),
      emptyState: document.getElementById('empty-state'),
      aiLoader: document.getElementById('ai-loader'),
      textInput: document.getElementById('text-input'),
      btnMic: document.getElementById('btn-mic'),
      iconMic: document.getElementById('icon-mic'),
      btnSend: document.getElementById('btn-send'),
      recordingStatus: document.getElementById('recording-status'),
      recordingTimer: document.getElementById('recording-timer'),
      modalDraft: document.getElementById('modal-draft'),
      draftTasksContainer: document.getElementById('draft-tasks-container'),
      draftSummary: document.getElementById('draft-summary'),
      btnConfirmDraft: document.getElementById('btn-confirm-draft'),
      btnDiscardDraft: document.getElementById('btn-discard-draft'),
      btnCloseDraft: document.getElementById('btn-close-draft'),
      modalDatePicker: document.getElementById('modal-date-picker'),
      btnCloseDatepicker: document.getElementById('btn-close-datepicker'),
      btnSaveDatepicker: document.getElementById('btn-save-datepicker'),
      pickerDay: document.getElementById('picker-day'),
      pickerMonth: document.getElementById('picker-month'),
      pickerYear: document.getElementById('picker-year'),
      pickerHour: document.getElementById('picker-hour'),
      pickerMinute: document.getElementById('picker-minute'),
      countToday: document.getElementById('count-today'),
      countUpcoming: document.getElementById('count-upcoming'),
      countCompleted: document.getElementById('count-completed')
    };

    document.addEventListener('DOMContentLoaded', async () => {
      applyTheme(state.theme, false);
      buildCustomPickerOptions();
      setupEventListeners();
      
      await loadTasksFromSupabase();
      
      renderTasks();
      startDueDateChecker();
      lucide.createIcons();
    });

    async function loadTasksFromSupabase() {
      if (!syncClient) return;

      try {
        const { data, error } = await syncClient.from('tasks').select('*');
        if (error) throw error;

        if (data && data.length > 0) {
          state.tasks = data;
          localStorage.setItem('androma_tasks', JSON.stringify(data));
        }
      } catch (err) {
        console.warn('Ошибка загрузки из Supabase, используем локальные данные:', err.message);
      }
    }

    function applyTheme(theme, animate = true) {
      state.theme = theme;
      localStorage.setItem('androma_theme', theme);
      const root = document.documentElement;

      if (animate) {
        DOM.btnThemeToggle.classList.add('animate-icon-swap');
        setTimeout(() => {
          updateThemeClasses(root, theme);
          DOM.btnThemeToggle.classList.remove('animate-icon-swap');
        }, 150);
      } else {
        updateThemeClasses(root, theme);
      }
    }

    function updateThemeClasses(root, theme) {
      if (theme === 'dark') {
        root.classList.add('dark');
        DOM.iconTheme.setAttribute('data-lucide', 'sun');
      } else {
        root.classList.remove('dark');
        DOM.iconTheme.setAttribute('data-lucide', 'moon');
      }
      lucide.createIcons();
    }

    function setupEventListeners() {
      DOM.btnThemeToggle.addEventListener('click', () => {
        applyTheme(state.theme === 'dark' ? 'light' : 'dark', true);
        triggerHaptic(15);
      });

      document.querySelectorAll('.tab-btn').forEach(btn => {
        btn.addEventListener('click', () => {
          document.querySelectorAll('.tab-btn').forEach(b => {
            b.classList.remove('bg-ios-blue', 'text-white');
            b.classList.add('text-ios-textSecondary');
          });
          btn.classList.add('bg-ios-blue', 'text-white');
          btn.classList.remove('text-ios-textSecondary');
          state.activeTab = btn.dataset.tab;
          renderTasks();
        });
      });

      DOM.textInput.addEventListener('input', () => {
        DOM.textInput.style.height = 'auto';
        DOM.textInput.style.height = Math.min(DOM.textInput.scrollHeight, 96) + 'px';
        toggleSendButton();
      });

      DOM.btnCloseDraft.addEventListener('click', () => DOM.modalDraft.classList.add('hidden'));
      DOM.btnDiscardDraft.addEventListener('click', () => DOM.modalDraft.classList.add('hidden'));
      DOM.btnConfirmDraft.addEventListener('click', saveDraftTasks);

      DOM.btnCloseDatepicker.addEventListener('click', closeDatePicker);
      DOM.btnSaveDatepicker.addEventListener('click', saveCustomDatePicker);

      DOM.btnSend.addEventListener('click', handleSendAction);

      setupMicGestures();
    }

    function buildCustomPickerOptions() {
      DOM.pickerDay.innerHTML = Array.from({length: 31}, (_, i) => `<option value="${i + 1}">${i + 1}</option>`).join('');
      DOM.pickerMonth.innerHTML = MONTHS.map((m, i) => `<option value="${i}">${m}</option>`).join('');
      const currentYr = new Date().getFullYear();
      DOM.pickerYear.innerHTML = Array.from({length: 5}, (_, i) => `<option value="${currentYr + i}">${currentYr + i}</option>`).join('');
      DOM.pickerHour.innerHTML = Array.from({length: 24}, (_, i) => `<option value="${i}">${String(i).padStart(2, '0')}</option>`).join('');
      DOM.pickerMinute.innerHTML = Array.from({length: 60}, (_, i) => `<option value="${i}">${String(i).padStart(2, '0')}</option>`).join('');
    }

    function populatePickerFromDate(dateObj) {
      const d = dateObj || new Date();
      DOM.pickerDay.value = d.getDate();
      DOM.pickerMonth.value = d.getMonth();
      DOM.pickerYear.value = d.getFullYear();
      DOM.pickerHour.value = d.getHours();
      DOM.pickerMinute.value = d.getMinutes();
    }

    function getPickerSelectedDate() {
      return new Date(
        parseInt(DOM.pickerYear.value),
        parseInt(DOM.pickerMonth.value),
        parseInt(DOM.pickerDay.value),
        parseInt(DOM.pickerHour.value),
        parseInt(DOM.pickerMinute.value)
      );
    }

    window.applyDatePreset = function(preset) {
      const d = new Date();
      if (preset === 'tomorrow') d.setDate(d.getDate() + 1);
      else if (preset === 'plus1h') d.setHours(d.getHours() + 1);
      else if (preset === 'plus1d') d.setDate(d.getDate() + 1);
      populatePickerFromDate(d);
      triggerHaptic(10);
    };

    window.openCustomDatePicker = function(contextType, target) {
      state.editingContext = { type: contextType, target };
      let initialIso = null;

      if (contextType === 'main') {
        const t = state.tasks.find(x => x.id === target);
        if (t) initialIso = t.due_date;
      } else if (contextType === 'draft') {
        const dt = state.draftTasks[target];
        if (dt) initialIso = dt.due_date;
      }

      populatePickerFromDate(initialIso ? new Date(initialIso) : new Date());
      DOM.modalDatePicker.classList.remove('hidden');
    };

    function closeDatePicker() {
      DOM.modalDatePicker.classList.add('hidden');
      state.editingContext = null;
    }

    function saveCustomDatePicker() {
      if (!state.editingContext) return;
      const selectedDate = getPickerSelectedDate();
      const isoStr = selectedDate.toISOString();

      if (state.editingContext.type === 'main') {
        const task = state.tasks.find(t => t.id === state.editingContext.target);
        if (task) {
          task.due_date = isoStr;
          saveTasksState();
          renderTasks();
        }
      } else if (state.editingContext.type === 'draft') {
        if (state.draftTasks[state.editingContext.target]) {
          state.draftTasks[state.editingContext.target].due_date = isoStr;
          renderDraftModalTasks();
        }
      }

      triggerHaptic(20);
      closeDatePicker();
    }

    function setupMicGestures() {
      const btn = DOM.btnMic;

      const handleStart = (e) => {
        const clientY = e.touches ? e.touches[0].clientY : e.clientY;
        state.recording.startY = clientY;

        if (!state.recording.isRecording) {
          startSpeechRecognition();
          triggerHaptic(25);
        }
      };

      const handleMove = (e) => {
        if (!state.recording.isRecording || state.recording.isLocked) return;
        const currentY = e.touches ? e.touches[0].clientY : e.clientY;
        const deltaY = state.recording.startY - currentY;

        if (deltaY > 30) {
          state.recording.isLocked = true;
          DOM.recordingStatus.classList.remove('hidden');
          DOM.btnSend.classList.remove('hidden');
          DOM.btnSend.classList.add('flex');
          triggerHaptic([30, 20, 30]);
        }
      };

      const handleEnd = () => {
        if (state.recording.isRecording && !state.recording.isLocked) {
          stopSpeechRecognitionAndProcess();
        }
      };

      btn.addEventListener('touchstart', handleStart, { passive: true });
      btn.addEventListener('touchmove', handleMove, { passive: true });
      btn.addEventListener('touchend', handleEnd);

      btn.addEventListener('mousedown', handleStart);
      btn.addEventListener('mouseup', handleEnd);
    }

    function startSpeechRecognition() {
      const SpeechRecognition = window.SpeechRecognition || window.webkitSpeechRecognition;
      if (!SpeechRecognition) {
        alert('Ваш браузер не поддерживает встроенный голосовой ввод. Введите текст вручную.');
        return;
      }

      const recognition = new SpeechRecognition();
      recognition.lang = 'ru-RU';
      recognition.interimResults = true;
      recognition.continuous = true;

      state.recording.transcriptText = "";
      state.recording.speechRecognition = recognition;

      recognition.onresult = (event) => {
        let currentText = "";
        for (let i = 0; i < event.results.length; i++) {
          currentText += event.results[i][0].transcript;
        }
        state.recording.transcriptText = currentText;
      };

      recognition.start();
      state.recording.isRecording = true;
      state.recording.startTime = Date.now();

      DOM.btnMic.classList.remove('bg-ios-blue');
      DOM.btnMic.classList.add('bg-ios-red');
      DOM.iconMic.setAttribute('data-lucide', 'square');
      lucide.createIcons();

      state.recording.timerInterval = setInterval(() => {
        const elapsedSec = Math.floor((Date.now() - state.recording.startTime) / 1000);
        const mins = String(Math.floor(elapsedSec / 60)).padStart(2, '0');
        const secs = String(elapsedSec % 60).padStart(2, '0');
        DOM.recordingTimer.textContent = `${mins}:${secs}`;
      }, 1000);
    }

    function stopSpeechRecognitionAndProcess() {
      if (!state.recording.speechRecognition) return;

      state.recording.speechRecognition.stop();
      clearInterval(state.recording.timerInterval);

      setTimeout(async () => {
        const text = state.recording.transcriptText.trim();
        resetMicUI();
        if (text) {
          await processTextInput(text);
        } else {
          alert('Речь не распознана');
        }
      }, 400);
    }

    function resetMicUI() {
      state.recording.isRecording = false;
      state.recording.isLocked = false;
      DOM.btnMic.classList.remove('bg-ios-red');
      DOM.btnMic.classList.add('bg-ios-blue');
      DOM.iconMic.setAttribute('data-lucide', 'mic');
      DOM.recordingStatus.classList.add('hidden');
      DOM.recordingTimer.textContent = '00:00';
      toggleSendButton();
      lucide.createIcons();
    }

    function toggleSendButton() {
      const hasText = DOM.textInput.value.trim().length > 0;
      if (hasText || state.recording.isLocked) {
        DOM.btnSend.classList.remove('hidden');
        DOM.btnSend.classList.add('flex');
      } else {
        DOM.btnSend.classList.add('hidden');
        DOM.btnSend.classList.remove('flex');
      }
    }

    async function handleSendAction() {
      if (state.recording.isRecording) {
        stopSpeechRecognitionAndProcess();
        return;
      }

      const text = DOM.textInput.value.trim();
      if (text) {
        DOM.textInput.value = '';
        DOM.textInput.style.height = 'auto';
        toggleSendButton();
        await processTextInput(text);
      }
    }

    async function processTextInput(rawText) {
      showLoader(true);
      try {
        const systemPrompt = `You are the AI engine for "Androma Tasker". Convert user request into a strict JSON structure.
Current ISO timestamp: ${new Date().toISOString()}

Return ONLY a valid JSON object without markdown formatting:
{
  "summary": "Short 1-sentence overview",
  "tasks": [
    {
      "id": "unique_id",
      "title": "Task title",
      "description": "Details or notes",
      "due_date": "ISO8601 string",
      "priority": "normal | high",
      "is_completed": false
    }
  ]
}`;

        const res = await fetch(`${CONFIG.WORKER_URL}/chat/completions`, {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({
            model: CONFIG.MODEL,
            messages: [
              { role: 'system', content: systemPrompt },
              { role: 'user', content: rawText }
            ],
            response_format: { type: 'json_object' },
            temperature: 0.2
          })
        });

        if (!res.ok) throw new Error('Ошибка связи с Воркером');
        const data = await res.json();
        
        let content = data.choices[0].message.content;
        content = content.replace(/```json/g, '').replace(/```/g, '').trim();
        const parsed = JSON.parse(content);

        showLoader(false);
        openDraftModal(parsed);

      } catch (err) {
        console.error('Ошибка:', err);
        simulateLocalParse(rawText);
      }
    }

    function simulateLocalParse(text) {
      showLoader(true);
      setTimeout(() => {
        showLoader(false);
        openDraftModal({
          summary: text.length > 35 ? text.slice(0, 30) + '...' : text,
          tasks: [{
            id: 'task_' + Date.now(),
            title: text,
            description: 'Создано через локальный обработчик.',
            due_date: new Date(Date.now() + 3600000 * 2).toISOString(),
            priority: 'normal',
            is_completed: false
          }]
        });
      }, 500);
    }

    function openDraftModal(parsedData) {
      state.draftTasks = parsedData.tasks || [];
      DOM.draftSummary.textContent = parsedData.summary || 'План задач';
      renderDraftModalTasks();
      DOM.modalDraft.classList.remove('hidden');
    }

    function renderDraftModalTasks() {
      DOM.draftTasksContainer.innerHTML = state.draftTasks.map((t, idx) => `
        <div class="ios-subcard rounded-2xl p-4 space-y-2 animate-enter">
          <div class="flex items-start justify-between space-x-2">
            <input type="text" value="${escapeHtml(t.title)}" onchange="updateDraftTask(${idx}, 'title', this.value)" class="bg-transparent font-semibold text-sm focus:outline-none w-full border-b border-transparent focus:border-ios-blue" />
            <span class="px-2.5 py-0.5 rounded-full text-[10px] font-semibold uppercase ${t.priority === 'high' ? 'bg-ios-red/20 text-ios-red' : 'bg-ios-blue/20 text-ios-blue'}">
              ${t.priority}
            </span>
          </div>
          <textarea onchange="updateDraftTask(${idx}, 'description', this.value)" class="w-full bg-transparent text-xs text-ios-textSecondary focus:outline-none resize-none leading-relaxed border-b border-transparent focus:border-ios-blue">${escapeHtml(t.description)}</textarea>
          
          <div class="pt-1 flex items-center justify-between">
            <span class="text-[10px] text-ios-textSecondary">Срок выполнения:</span>
            <button onclick="openCustomDatePicker('draft', ${idx})" class="px-3 py-1 rounded-full bg-ios-blue/15 text-ios-blue hover:bg-ios-blue/25 text-[11px] font-semibold flex items-center space-x-1.5 transition active:scale-95">
              <i data-lucide="clock" class="w-3 h-3"></i>
              <span>${formatDate(t.due_date)}</span>
            </button>
          </div>
        </div>
      `).join('');

      lucide.createIcons();
    }

    window.updateDraftTask = function(index, field, value) {
      if (state.draftTasks[index]) state.draftTasks[index][field] = value;
    };

    function saveDraftTasks() {
      state.tasks.push(...state.draftTasks);
      saveTasksState();
      DOM.modalDraft.classList.add('hidden');
      renderTasks();
      triggerHaptic(30);
    }

    function renderTasks() {
      const filtered = filterTasksByTab(state.activeTab);
      updateTabCounts();

      if (filtered.length === 0) {
        DOM.taskList.innerHTML = '';
        DOM.emptyState.classList.remove('hidden');
        DOM.emptyState.classList.add('flex');
        return;
      }

      DOM.emptyState.classList.add('hidden');
      DOM.emptyState.classList.remove('flex');

      DOM.taskList.innerHTML = filtered.map(task => `
        <div id="task-card-${task.id}" class="ios-card rounded-2xl p-4 shadow-sm animate-enter">
          <div class="flex items-center justify-between">
            <div class="flex items-center space-x-3 flex-1 min-w-0 pr-2">
              <button onclick="toggleTaskCompletion('${task.id}')" class="w-6 h-6 rounded-full border-2 ${task.is_completed ? 'bg-ios-blue border-ios-blue flex items-center justify-center' : 'border-ios-textSecondary bg-transparent'} transition flex-shrink-0 active:scale-90">
                ${task.is_completed ? '<i data-lucide="check" class="w-3.5 h-3.5 text-white"></i>' : ''}
              </button>

              <div class="min-w-0 flex-1">
                <div class="flex items-center space-x-2">
                  <button onclick="openCustomDatePicker('main', '${task.id}')" class="text-[11px] font-medium text-ios-blue hover:underline flex items-center space-x-1">
                    <span>${formatDate(task.due_date)}</span>
                    <i data-lucide="edit-2" class="w-2.5 h-2.5"></i>
                  </button>
                  ${task.priority === 'high' ? '<span class="w-1.5 h-1.5 rounded-full bg-ios-red"></span>' : ''}
                </div>
                <h3 class="text-sm font-semibold truncate ${task.is_completed ? 'line-through text-ios-textSecondary' : ''}">${escapeHtml(task.title)}</h3>
              </div>
            </div>

            <button onclick="toggleAccordion(event, 'desc-${task.id}')" class="w-8 h-8 rounded-full ios-subcard flex items-center justify-center text-ios-textSecondary hover:text-ios-blue transition active:scale-95">
              <i data-lucide="chevron-down" class="w-4 h-4 transition-transform duration-200" id="arrow-desc-${task.id}"></i>
            </button>
          </div>

          <div id="desc-${task.id}" class="hidden pt-3 mt-3 border-t border-white/10 text-xs text-ios-textSecondary leading-relaxed">
            <p>${escapeHtml(task.description || 'Описание отсутствует.')}</p>
            <div class="mt-3 flex justify-end space-x-2">
              <button onclick="openCustomDatePicker('main', '${task.id}')" class="px-3 py-1 rounded-full ios-subcard text-[11px] font-semibold flex items-center space-x-1 transition active:scale-95">
                <i data-lucide="calendar" class="w-3 h-3 text-ios-blue"></i>
                <span>Время</span>
              </button>

              <button onclick="deleteTask('${task.id}')" class="px-3 py-1 rounded-full bg-ios-red/10 text-ios-red hover:bg-ios-red/20 text-[11px] font-semibold flex items-center space-x-1 transition active:scale-95">
                <i data-lucide="trash-2" class="w-3 h-3"></i>
                <span>Удалить</span>
              </button>
            </div>
          </div>
        </div>
      `).join('');

      lucide.createIcons();
    }

    window.toggleAccordion = function(event, elementId) {
      event.stopPropagation();
      const el = document.getElementById(elementId);
      const arrow = document.getElementById('arrow-' + elementId);
      if (el) {
        const isHidden = el.classList.contains('hidden');
        el.classList.toggle('hidden');
        if (arrow) {
          arrow.style.transform = isHidden ? 'rotate(180deg)' : 'rotate(0deg)';
        }
      }
    };

    window.toggleTaskCompletion = function(id) {
      const cardEl = document.getElementById(`task-card-${id}`);
      if (cardEl) {
        cardEl.classList.add('animate-exit');
        setTimeout(() => {
          const task = state.tasks.find(t => t.id === id);
          if (task) {
            task.is_completed = !task.is_completed;
            saveTasksState();
            renderTasks();
            triggerHaptic(20);
          }
        }, 200);
      }
    };

    window.deleteTask = function(id) {
      const cardEl = document.getElementById(`task-card-${id}`);
      if (cardEl) {
        cardEl.classList.add('animate-exit');
        setTimeout(async () => {
          state.tasks = state.tasks.filter(t => t.id !== id);
          saveTasksState();

          if (syncClient) {
            try {
              await syncClient.from('tasks').delete().eq('id', id);
            } catch (err) {
              console.warn('Ошибка удаления из Supabase:', err.message);
            }
          }

          renderTasks();
          triggerHaptic(30);
        }, 200);
      }
    };

    function filterTasksByTab(tab) {
      const now = new Date();
      return state.tasks.filter(t => {
        if (tab === 'completed') return t.is_completed;
        if (t.is_completed) return false;

        const dueDate = new Date(t.due_date);
        const isToday = dueDate.toDateString() === now.toDateString();

        if (tab === 'today') return isToday || dueDate < now;
        if (tab === 'upcoming') return !isToday && dueDate > now;
        return true;
      });
    }

    function updateTabCounts() {
      updateBadgeWithAnimation(DOM.countToday, filterTasksByTab('today').length);
      updateBadgeWithAnimation(DOM.countUpcoming, filterTasksByTab('upcoming').length);
      updateBadgeWithAnimation(DOM.countCompleted, filterTasksByTab('completed').length);
    }

    function updateBadgeWithAnimation(element, newValue) {
      if (element.textContent !== String(newValue)) {
        element.textContent = newValue;
        element.classList.remove('animate-pop');
        void element.offsetWidth;
        element.classList.add('animate-pop');
      }
    }

    async function saveTasksState() {
      localStorage.setItem('androma_tasks', JSON.stringify(state.tasks));

      if (syncClient) {
        try {
          const { error } = await syncClient.from('tasks').upsert(state.tasks);
          if (error) console.error('Ошибка сохранения в Supabase:', error.message);
        } catch (err) {
          console.warn('Sync error:', err.message);
        }
      }
    }

    function startDueDateChecker() {
      setInterval(() => {
        const now = new Date();
        state.tasks.forEach(t => {
          if (!t.is_completed && !t.notified && t.due_date) {
            const dueDate = new Date(t.due_date);
            if (now >= dueDate) {
              t.notified = true;
              saveTasksState();
            }
          }
        });
      }, 30000);
    }

    function showLoader(show) {
      if (show) DOM.aiLoader.classList.remove('hidden');
      else DOM.aiLoader.classList.add('hidden');
    }

    function triggerHaptic(pattern) {
      if ('vibrate' in navigator) navigator.vibrate(pattern);
    }

    function formatDate(isoStr) {
      if (!isoStr) return 'Сегодня';
      const d = new Date(isoStr);
      if (isNaN(d.getTime())) return 'Сегодня';
      return d.toLocaleString('ru-RU', { day: 'numeric', month: 'short', hour: '2-digit', minute: '2-digit' });
    }

    function escapeHtml(str) {
      return (str || '').replace(/&/g, "&amp;").replace(/</g, "&lt;").replace(/>/g, "&gt;").replace(/"/g, "&quot;");
    }
  </script>
</body>
</html>
